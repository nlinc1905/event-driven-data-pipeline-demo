asyncapi: "3.0.0"

info:
  title: Document Processing API
  version: "1.0.0"
  description: |
    Async WebSocket API for document generation. Clients connect to a channel,
    a Temporal workflow is dispatched, and a single completion message is pushed
    when the workflow finishes. The connection is closed by the server after delivery.

servers:
  local:
    host: localhost:8000
    protocol: ws
    description: Local development server

channels:
  /generate:
    address: /generate
    description: |
      Connect to trigger document generation. The server starts a Temporal workflow,
      waits for completion via a Redis pub/sub channel, then pushes the result and
      closes the connection.
    messages:
      statusEvent:
        $ref: "#/components/messages/statusEvent"
      documentResult:
        $ref: "#/components/messages/documentResult"

operations:
  receiveDocumentResult:
    action: receive
    channel:
      $ref: "#/channels/~1generate"
    summary: Receive document generation result
    description: |
      Sent by the server once the Temporal workflow completes. This is the only
      message the server sends on this channel. The connection is closed immediately
      after delivery.
    messages:
      - $ref: "#/channels/~1generate/messages/documentResult"

components:
  messages:
    statusEvent:
      name: statusEvent
      title: Status Event
      summary: Emitted by the server when a notable stage in processing is reached.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/statusEvent"
    documentResult:
      name: documentResult
      title: Document Generation Result
      summary: The completed document generation result pushed by the server.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/documentResult"

  schemas:
    statusEvent:
      type: object
      required:
        - status
        - message
      properties:
        type:
          type: string
          enum: [status]
        status:
          type: string
          enum: [received]
          description: Machine-readable stage identifier. Extend as new stages are added.
        message:
          type: string
          description: Human-readable description of the current stage.
          examples:
            - "Document received, generation started"
    documentResult:
      type: object
      required:
        - status
        - document
      properties:
        status:
          type: string
          enum:
            - completed
            - failed
          description: Whether document generation succeeded or failed.
          examples:
            - completed
        document:
          type: string
          description: The generated document content, or an error message if status is failed.
          examples:
            - "Generated document content here..."
