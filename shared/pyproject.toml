[project]
name = "shared"
version = "0.1.0"
dependencies = [
    "temporalio>=1.27.2",
    "redis>=8.0.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"shared" = "."}
packages = ["shared", "shared.activities", "shared.clients"]
